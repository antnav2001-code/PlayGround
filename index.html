hite-space:nowrap}.empty{padding:35px;text-align:center;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:7px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.vehicle-card{border:1px solid var(--line);background:#191c19;border-radius:11px;overflow:hidden;transition:border-color .2s,transform .2s}.vehicle-card:hover{border-color:#657448;transform:translateY(-2px)}.car-visual{height:142px;position:relative;background:radial-gradient(ellipse at 52% 76%,#66704a3a,transparent 57%),linear-gradient(140deg,#252a24,#1b1e1a);display:grid;place-items:center}.car-visual svg{width:89%;filter:drop-shadow(0 10px 8px #0009)}.car-visual .tag{position:absolute;left:12px;top:12px}.card-body{padding:15px}.card-title{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.card-title h4{margin:0;font-size:13px}.card-title small{display:block;color:var(--muted);font:9px var(--mono);margin-top:5px}.price{font:12px var(--mono);color:var(--lime);white-space:nowrap}.card-meta{display:flex;justify-content:space-between;border-top:1px solid #2c302c;margin-top:13px;padding-top:11px;color:#a5ada2;font:9px var(--mono)}.card-actions{display:flex;gap:7px;margin-top:13px}.card-actions .btn{flex:1;padding:9px 5px;font-size:10px}.build-banner{padding:23px 25px;border:1px solid #404736;background:linear-gradient(110deg,#252b21,#1a1e19);border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.build-banner h3{font-size:17px;margin:0 0 6px}.build-banner p{color:var(--muted);font-size:11px;margin:0}.workshop-grid{grid-template-columns:1.1fr .9fr}.work-card{background:#191c19;border:1px solid var(--line);border-radius:11px;padding:20px}.work-card h3{font-size:14px;margin:0 0 6px}.work-card>p{font-size:11px;color:var(--muted);margin:0 0 18px;line-height:1.5}.select-label{font:9px var(--mono);letter-spacing:.9px;color:#929991;text-transform:uppercase;display:block;margin-bottom:7px}.field{width:100%;background:#111411;border:1px solid #343a33;border-radius:7px;color:var(--text);padding:11px 12px;font:11px var(--sans);margin-bottom:15px}.parts{display:grid;gap:9px}.part{display:flex;align-items:center;justify-content:space-between;padding:11px;background:#20241f;border:1px solid #303630;border-radius:8px}.part-info strong{display:block;font-size:11px}.part-info small{color:var(--muted);display:block;font-size:9px;margin-top:4px}.part .btn{padding:8px 10px;font-size:9px}.progress{height:5px;background:#30362c;border-radius:9px;overflow:hidden;margin:11px 0}.progress i{height:100%;display:block;background:var(--lime);border-radius:9px}.stats-mini{display:flex;gap:8px;margin-top:13px}.mini{flex:1;background:#20241f;border-radius:7px;padding:9px}.mini span{font:8px var(--mono);color:var(--muted);display:block}.mini b{font:11px var(--mono);display:block;margin-top:6px}.note{font-size:10px;color:#a4ad9e;line-height:1.6;border-left:2px solid var(--lime);padding:4px 0 4px 11px;margin-top:16px}.ledger-row{display:grid;grid-template-columns:1fr 100px 100px;gap:10px;padding:13px 17px;border-bottom:1px solid #282d28;font-size:11px;align-items:center}.ledger-row:last-child{border:0}.ledger-row small{display:block;color:var(--muted);font:9px var(--mono);margin-top:4px}.ledger-row>span:last-child{text-align:right;font:11px var(--mono)}.gain{color:var(--lime)}.loss{color:var(--red)}.toast{position:fixed;right:23px;bottom:22px;z-index:10;background:#d3f780;color:#17200f;font-size:12px;font-weight:700;padding:12px 17px;border-radius:9px;box-shadow:0 10px 35px #0008;animation:appear .2s}.notice{padding:10px 12px;border-radius:7px;background:#282c22;color:#bec8ac;font-size:10px;line-height:1.5;margin:13px 0}.mobile-nav{display:none}

<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">M</div><div class="brand-name">MOTORHOUSE<small>GARAGE & EXCHANGE</small></div></div><div class="nav-label">YOUR BUSINESS</div><nav class="nav" id="sideNav"></nav><div class="side-bottom"><div class="day-card"><label>OPERATING DAY</label><strong id="sideDay">Day 1</strong><span>↗ Make it count</span></div><div class="profile"><div class="avatar">Y</div><div><strong>Your Garage</strong><small>Independent dealer</small></div></div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow" id="eyebrow">MONDAY · DAY 1</div><h1 class="page-title" id="pageTitle">Your dashboard</h1></div><div class="top-right"><button class="mobile-menu" id="nextDay">↗ Next day</button><div class="weather">☀ &nbsp;CLEAR SKIES</div><div class="cash-pill">CASH &nbsp;<b id="cashTop">$38,500</b></div></div></header><div id="content"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav><div id="toastRoot"></div>
<script>
const navItems=[['dashboard','▦','Overview'],['market','⌕','Marketplace'],['garage','▰','My garage'],['workshop','⚒','Workshop'],['ledger','≡','Ledger']];
const colors=['#d7e3c3','#c8f169','#c88b68','#8797aa','#d9d3c3','#9d8caf','#e47d67'];
const stock=[
 {name:'2014 Honda Civic LX',year:2014,kind:'Sedan',miles:112400,cond:72,ask:7200,color:'#91a283',base:10300,desc:'Reliable daily · 1.8L I4'},
 {name:'2017 Mazda MX-5 Miata',year:2017,kind:'Roadster',miles:68400,cond:83,ask:13900,color:'#b95d4c',base:18400,desc:'Pure driving · 2.0L I4'},
 {name:'2012 Ford F-150 XLT',year:2012,kind:'Pickup',miles:145000,cond:59,ask:8900,color:'#697b8c',base:13500,desc:'Work-ready · 5.0L V8'},
 {name:'2016 Volkswagen Golf GTI',year:2016,kind:'Hatchback',miles:93200,cond:68,ask:10800,color:'#a58f62',base:15300,desc:'Turbocharged · 2.0L I4'},
 {name:'2019 Toyota Corolla SE',year:2019,kind:'Sedan',miles:57600,cond:90,ask:14700,color:'#788b82',base:19100,desc:'One owner · 2.0L I4'},
 {name:'2013 Jeep Wrangler Sport',year:2013,kind:'4x4',miles:121000,cond:62,ask:12800,color:'#7d8760',base:17600,desc:'Trail-ready · 3.6L V6'}
];
const partCatalog=[{id:'engine',name:'Performance engine',desc:'More power, more value',cost:2800,boost:4300},{id:'paint',name:'Premium paint job',desc:'Fresh finish, showroom shine',cost:950,boost:1750},{id:'interior',name:'Interior refresh',desc:'Restore the cabin comfort',cost:1200,boost:2100},{id:'wheels',name:'Sport wheel set',desc:'Lightweight alloys & new tires',cost:1650,boost:2750},{id:'suspension',name:'Suspension rebuild',desc:'Tight handling, safer ride',cost:1400,boost:2350}];
let state=(()=>{try{let saved=JSON.parse(localStorage.getItem('motorhouse-save'));if(saved&&saved.cash!=null)return saved}catch(e){}return {cash:38500,day:1,rep:12,screen:'dashboard',inventory:[],market:[],ledger:[],selectedId:null,serial:1}})();
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}function uid(){return 'v'+(state.serial++)}function carSvg(color='#c8f169',variant=0){let wheel=variant%2?'#20231e':'#262a24';return `<svg viewBox="0 0 420 150" aria-hidden="true"><ellipse cx="214" cy="126" rx="164" ry="10" fill="#070907" opacity=".55"/><path d="M51 103l10-25c3-8 9-13 18-16l51-13 35-31c5-5 11-7 19-7h76c10 0 18 4 25 12l34 39 36 11c10 3 17 10 20 20l5 17c2 6-2 10-9 10h-25a36 36 0 0 0-70 0H147a36 36 0 0 0-70 0H56c-8 0-11-7-8-17z" fill="${color}" stroke="#111510" stroke-width="4"/><path d="M145 48l33-29c4-3 8-4 14-4h30v39H137z" fill="#202b27" stroke="#111510" stroke-width="3"/><path d="M230 15h28c7 0 12 3 17 9l27 30h-72z" fill="#202b27" stroke="#111510" stroke-width="3"/><path d="M195 18v38M235 59h85" stroke="#181c18" stroke-width="3"/><path d="M54 91l18-6M355 77l21 8" stroke="#f2e5b3" stroke-width="6" stroke-linecap="round"/><path d="M52 105h31M350 105h29" stroke="#272c25" stroke-width="5"/><circle cx="112" cy="111" r="24" fill="${wheel}" stroke="#10130f" stroke-width="5"/><circle cx="112" cy="111" r="10" fill="#9da49a"/><circle cx="112" cy="111" r="4" fill="#333a32"/><circle cx="317" cy="111" r="24" fill="${wheel}" stroke="#10130f" stroke-width="5"/><circle cx="317" cy="111" r="10" fill="#9da49a"/><circle cx="317" cy="111" r="4" fill="#333a32"/><path d="M170 58h164" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/></svg>`}
function makeMarket(){state.market=stock.map((s,i)=>({...s,id:'m'+state.day+'-'+i,condition:s.cond+Math.round(Math.random()*10-5),ask:Math.round(s.ask*(.94+Math.random()*.12))}));state.marketDay=state.day;}
if(state.marketDay!==state.day)makeMarket();
function navRender(){const html=navItems.map(([id,ico,label])=>`<button class="${state.screen===id?'active':''}" data-screen="${id}"><span class="ico">${ico}</span>${label}${id==='market'?`<span class="badge">${state.market.length}</span>`:''}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=navItems.map(([id,ico,label])=>`<button class="${state.screen===id?'active':''}" data-screen="${id}"><span>${ico}</span>${label}</button>`).join('');document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>go(b.dataset.screen));}
function head(){document.getElementById('cashTop').textContent=money(state.cash);document.getElementById('sideDay').textContent='Day '+state.day;document.getElementById('eyebrow').textContent=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'][(state.day-1)%7]+' · DAY '+state.day;document.getElementById('pageTitle').textContent={dashboard:'Your dashboard',market:'Find your next deal',garage:'Your garage',workshop:'Build something brilliant',ledger:'The books'}[state.screen];}
function go(screen){state.screen=screen;render()}
function toast(msg){let root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>root.innerHTML='',2300)}
function carValue(c){let parts=(c.parts||[]).reduce((a,id)=>a+(partCatalog.find(p=>p.id===id)?.boost||0),0);return Math.round(c.base*(.55+c.cond/200)+parts)}
function badge(c){return c.cond>=80?'Excellent':c.cond>=65?'Good':'Needs love'}function cond(c){return `<span class="condition"><i class="dot ${c.cond<60?'low':c.cond<75?'mid':''}"></i>${c.cond}%</span>`}
function card(c,mode){let owned=mode==='owned',price=owned?money(carValue(c)):money(c.ask);return `<article class="vehicle-card"><div class="car-visual"><span class="pill tag">${badge(c)}</span>${carSvg(c.color,c.year)}</div><div class="card-body"><div class="card-title"><div><h4>${c.name}</h4><small>${c.desc||c.kind+' · '+c.year}</small></div><span class="price">${price}</span></div><div class="card-meta"><span>${c.miles.toLocaleString()} MI</span><span>${cond(c)}</span><span>${c.kind.toUpperCase()}</span></div><div class="card-actions">${owned?`<button class="btn secondary" onclick="selectForBuild('${c.id}')">⚒ Build</button><button class="btn" onclick="sellCar('${c.id}')">Sell · ${money(carValue(c))}</button>`:`<button class="btn" onclick="buyCar('${c.id}')" ${state.cash<c.ask?'disabled':''}>Buy · ${money(c.ask)}</button>`}</div></div></article>`}
function dash(){let value=state.inventory.reduce((n,c)=>n+carValue(c),0),profit=state.ledger.filter(x=>x.type==='sale').reduce((n,x)=>n+x.amount,0)-state.ledger.filter(x=>x.type==='purchase'||x.type==='part').reduce((n,x)=>n+x.amount,0);let recent=state.ledger.slice(0,4);return `<section class="hero"><div class="hero-copy"><span class="hero-tag">INDEPENDENT SINCE DAY ONE</span><h2>Every great<br>garage starts<br>somewhere.</h2><p>Spot the deal. Make it yours. Build a reputation one car at a time.</p><button class="btn" onclick="go('market')">Browse today's finds &nbsp;→</button></div><div class="hero-art">${carSvg('#c8f169',1)}</div></section><div class="grid stats"><div class="stat"><div class="stat-top">Available cash <span class="stat-icon">◈</span></div><strong>${money(state.cash)}</strong><small class="positive">Ready to invest</small></div><div class="stat"><div class="stat-top">Garage value <span class="stat-icon">▰</span></div><strong>${money(value)}</strong><small>${state.inventory.length} vehicle${state.inventory.length===1?'':'s'} in stock</small></div><div class="stat"><div class="stat-top">Reputation <span class="stat-icon">✳</span></div><strong>${state.rep}<small style="font-size:13px;color:#929991"> / 100</small></strong><small class="positive">${state.rep<30?'Local newcomer':state.rep<60?'Known around town':'Neighborhood favorite'}</small></div><div class="stat"><div class="stat-top">Net profit <span class="stat-icon">↗</span></div><strong>${money(profit)}</strong><small>Across all deals</small></div></div><div class="grid" style="grid-template-columns:1fr;gap:25px"><section><div class="section-head"><div><h3>Fresh from the marketplace</h3><p>Good deals don't stay parked for long.</p></div><button class="btn ghost" onclick="go('market')">See all ${state.market.length} →</button></div><div class="grid cards">${state.market.slice(0,3).map(c=>card(c,'market')).join('')}</div></section><section><div class="section-head"><div><h3>Latest activity</h3><p>Your business, at a glance.</p></div><button class="btn ghost" onclick="go('ledger')">Open ledger →</button></div>${activityRows(recent)}</section></div>`}
function activityRows(entries){if(!entries.length)return `<div class="list"><div class="empty"><b>It's a clean slate.</b>Buy your first car to get the wheels turning.</div></div>`;return `<div class="list">${entries.map(x=>`<div class="ledger-row"><div>${x.title}<small>Day ${x.day} · ${x.detail}</small></div><span>${x.type==='sale'?'Sale':'Expense'}</span><span class="${x.type==='sale'?'gain':'loss'}">${x.type==='sale'?'+':'−'}${money(x.amount)}</span></div>`).join('')}</div>`}
function market(){return `<div class="section-head"><div><h3>Today's listings</h3><p>Six hand-picked opportunities. Check condition before you commit.</p></div><span class="pill">${state.market.length} AVAILABLE</span></div>${state.market.length?`<div class="grid cards">${state.market.map(c=>card(c,'market')).join('')}</div>`:`<div class="list"><div class="empty"><b>The lot is picked clean.</b>Roll into the next day to see new listings.<br><br><button class="btn" onclick="nextDay()">Advance to next day →</button></div></div>`}<div class="notice">Dealer tip: a car's condition and mileage affect the resale price. Put some work into a rough find in the workshop to unlock its real value.</div>`}
function garage(){return `<div class="build-banner"><div><h3>${state.inventory.length?`${state.inventory.length} ride${state.inventory.length===1?'':'s'} in your garage`:'Your first bay is waiting.'}</h3><p>${state.inventory.length?'Tune them up, then sell for a tidy profit.':'Find a promising vehicle at the marketplace to get started.'}</p></div><button class="btn" onclick="go('${state.inventory.length?'workshop':'market'}')">${state.inventory.length?'Open workshop':'Browse cars'} →</button></div>${state.inventory.length?`<div class="grid cards">${state.inventory.map(c=>card(c,'owned')).join('')}</div>`:`<div class="list"><div class="empty"><b>No cars in stock yet.</b>Every great dealer's story begins with one good buy.</div></div>`}`}
function workshop(){let selected=state.inventory.find(c=>c.id===state.selectedId)||state.inventory[0];if(selected)state.selectedId=selected.id;return `<div class="build-banner"><div><h3>Turn a rough diamond into a showroom star.</h3><p>Install upgrades to raise resale value, then take your build to market.</p></div><span class="pill">${state.inventory.length} PROJECT${state.inventory.length===1?'':'S'}</span></div>${!selected?`<div class="list"><div class="empty"><b>Your workshop is quiet.</b>Buy a vehicle first, then come back to build.<br><br><button class="btn" onclick="go('market')">Find a project →</button></div></div>`:`<div class="grid workshop-grid"><section class="work-card"><span class="select-label">SELECT A PROJECT</span><select class="field" onchange="state.selectedId=this.value;render()">${state.inventory.map(c=>`<option value="${c.id}" ${c.id===selected.id?'selected':''}>${c.name} · ${c.cond}% condition</option>`).join('')}</select><div class="car-visual" style="height:185px;border-radius:9px">${carSvg(selected.color,selected.year)}</div><h3 style="margin-top:17px">${selected.name}</h3><p>${selected.desc||selected.kind+' · '+selected.year}</p><span class="select-label">OVERALL CONDITION — ${selected.cond}%</span><div class="progress"><i style="width:${selected.cond}%"></i></div><div class="stats-mini"><div class="mini"><span>CURRENT VALUE</span><b>${money(carValue(selected))}</b></div><div class="mini"><span>UPGRADES FITTED</span><b>${(selected.parts||[]).length} / ${partCatalog.length}</b></div><div class="mini"><span>ASKING</span><b>${money(carValue(selected)+1000)}</b></div></div><div class="note">Build smart: parts increase value, but your profit is what remains after purchase and upgrade costs.</div></section><section class="work-card"><h3>Parts & upgrades</h3><p>Install one of these improvements. A part can only be fitted once per vehicle.</p><div class="parts">${partCatalog.map(p=>{let done=(selected.parts||[]).includes(p.id);return `<div class="part"><div class="part-info"><strong>${p.name}</strong><small>${done?'Installed · adds '+money(p.boost)+' value':p.desc+' · +'+money(p.boost)+' value'}</small></div><button class="btn ${done?'secondary':''}" ${done||state.cash<p.cost?'disabled':''} onclick="installPart('${selected.id}','${p.id}')">${done?'✓ Fitted':money(p.cost)}</button></div>`}).join('')}</div><div class="notice">Need more cash? Sell a vehicle from your garage, or wait for the next day's fresh listings.</div></section></div>`}`}
function ledger(){let spent=state.ledger.filter(x=>x.type!=='sale').reduce((n,x)=>n+x.amount,0),earned=state.ledger.filter(x=>x.type==='sale').reduce((n,x)=>n+x.amount,0);return `<div class="grid stats" style="margin-bottom:21px"><div class="stat"><div class="stat-top">Total revenue</div><strong>${money(earned)}</strong><small>Vehicle sales</small></div><div class="stat"><div class="stat-top">Total investment</div><strong>${money(spent)}</strong><small>Cars & improvements</small></div><div class="stat"><div class="stat-top">Net result</div><strong class="${earned-spent>=0?'positive':''}">${money(earned-spent)}</strong><small>Revenue less investment</small></div><div class="stat"><div class="stat-top">Deals completed</div><strong>${state.ledger.filter(x=>x.type==='sale').length}</strong><small>More deals, more reputation</small></div></div><div class="section-head"><div><h3>Transaction history</h3><p>Every dollar tells a story.</p></div></div>${activityRows(state.ledger)}</div>`}
function render(){try{localStorage.setItem('motorhouse-save',JSON.stringify(state))}catch(e){}head();navRender();let views={dashboard:dash,market,garage,workshop,ledger};document.getElementById('content').innerHTML=`<div class="view">${views[state.screen]()}</div>`}
function addLog(type,title,amount,detail){state.ledger.unshift({type,title,amount,detail,day:state.day})}
function buyCar(id){let c=state.market.find(x=>x.id===id);if(!c||state.cash<c.ask)return;state.cash-=c.ask;state.inventory.push({...c,id:uid(),parts:[]});addLog('purchase','Bought '+c.name,c.ask,'Vehicle purchase');state.market=state.market.filter(x=>x.id!==id);toast('Nice find. '+c.name+' is yours.');render()}
function sellCar(id){let i=state.inventory.findIndex(x=>x.id===id);if(i<0)return;let c=state.inventory[i],value=carValue(c),offer=Math.round(value*(.94+Math.random()*.12));state.cash+=offer;state.rep=Math.min(100,state.rep+Math.max(1,Math.round(c.cond/18)));addLog('sale','Sold '+c.name,offer,'Retail sale · '+c.cond+'% condition');state.inventory.splice(i,1);if(state.selectedId===id)state.selectedId=state.inventory[0]?.id||null;toast('Sold for '+money(offer)+'! Reputation +'+Math.max(1,Math.round(c.cond/18)));render()}
function installPart(carId,partId){let c=state.inventory.find(x=>x.id===carId),p=partCatalog.find(x=>x.id===partId);if(!c||!p||state.cash<p.cost||(c.parts||[]).includes(partId))return;state.cash-=p.cost;c.parts.push(partId);c.cond=Math.min(100,c.cond+Math.round(p.boost/500));addLog('part','Installed '+p.name,p.cost,c.name);toast(p.name+' installed. Value is up!');render()}
function selectForBuild(id){state.selectedId=id;go('workshop')}
function nextDay(){state.day++;makeMarket();let income=state.inventory.length?Math.min(250,state.inventory.length*45):0;if(income){state.cash-=income;addLog('part','Lot & upkeep',income,'Daily operating costs')}toast('Day '+state.day+' — fresh listings just landed.');render()}
document.getElementById('nextDay').onclick=nextDay;
render();
</script></body></html>
