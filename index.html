<script>

 {name:'2014 Honda Civic LX',year:2014,kind:'Sedan',miles:112400,cond:72,ask:7200,color:'#91a283',base:10300,desc:'Reliable daily · 1.8L I4'},
 {name:'2017 Mazda MX-5 Miata',year:2017,kind:'Roadster',miles:68400,cond:83,ask:13900,color:'#b95d4c',base:18400,desc:'Pure driving · 2.0L I4'},

 {name:'2013 Jeep Wrangler Sport',year:2013,kind:'4x4',miles:121000,cond:62,ask:12800,color:'#7d8760',base:17600,desc:'Trail-ready · 3.6L V6'}
];
const partCatalog=[{id:'engine',name:'Performance engine',desc:'More power, more value',cost:2800,boost:4300},{id:'paint',name:'Premium paint job',desc:'Fresh finish, showroom shine',cost:950,boost:1750},{id:'interior',name:'Interior refresh',desc:'Restore the cabin comfort',cost:1200,boost:2100},{id:'wheels',name:'Sport wheel set',desc:'Lightweight alloys & new tires',cost:1650,boost:2750},{id:'suspension',name:'Suspension rebuild',desc:'Tight handling, safer ride',cost:1400,boost:2350}];
let state=(()=>{try{let saved=JSON.parse(localStorage.getItem('motorhouse-save'));if(saved&&saved.cash!=null)return saved}catch(e){}return {cash:38500,day:1,rep:12,screen:'dashboard',inventory:[],market:[],ledger:[],selectedId:null,serial:1}})();
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}function uid(){return 'v'+(state.serial++)}function carSvg(color='#c8f169',variant=0){let wheel=variant%2?'#20231e':'#262a24';return `<svg viewBox="0 0 420 150" aria-hidden="true"><ellipse cx="214" cy="126" rx="164" ry="10" fill="#070907" opacity=".55"/><path d="M51 103l10-25c3-8 9-13 18-16l51-13 35-31c5-5 11-7 19-7h76c10 0 18 4 25 12l34 39 36 11c10 3 17 10 20 20l5 17c2 6-2 10-9 10h-25a36 36 0 0 0-70 0H147a36 36 0 0 0-70 0H56c-8 0-11-7-8-17z" fill="${color}" stroke="#111510" stroke-width="4"/><path d="M145 48l33-29c4-3 8-4 14-4h30v39H137z" fill="#202b27" stroke="#111510" stroke-width="3"/><path d="M230 15h28c7 0 12 3 17 9l27 30h-72z" fill="#202b27" stroke="#111510" stroke-width="3"/><path d="M195 18v38M235 59h85" stroke="#181c18" stroke-width="3"/><path d="M54 91l18-6M355 77l21 8" stroke="#f2e5b3" stroke-width="6" stroke-linecap="round"/><path d="M52 105h31M350 105h29" stroke="#272c25" stroke-width="5"/><circle cx="112" cy="111" r="24" fill="${wheel}" stroke="#10130f" stroke-width="5"/><circle cx="112" cy="111" r="10" fill="#9da49a"/><circle cx="112" cy="111" r="4" fill="#333a32"/><circle cx="317" cy="111" r="24" fill="${wheel}" stroke="#10130f" stroke-width="5"/><circle cx="317" cy="111" r="10" fill="#9da49a"/><circle cx="317" cy="111" r="4" fill="#333a32"/><path d="M170 58h164" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/></svg>`}
function makeMarket(){state.market=stock.map((s,i)=>({...s,id:'m'+state.day+'-'+i,condition:s.cond+Math.round(Math.random()*10-5),ask:Math.round(s.ask*(.94+Math.random()*.12))}));state.marketDay=state.day;}
if(state.marketDay!==state.day)makeMarket();
function navRender(){const html=navItems.map(([id,ico,label])=>`<button class="${state.screen===id?'active':''}" data-screen="${id}"><span class="ico">${ico}</span>${label}${id==='market'?`<span class="badge">${state.market.length}</span>`:''}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=navItems.map(([id,ico,label])=>`<button class="${state.screen===id?'active':''}" data-screen="${id}"><span>${ico}</span>${id==='lot'?'Lot':label}</button>`).join('');document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>go(b.dataset.screen));}
function head(){document.getElementById('cashTop').textContent=money(state.cash);document.getElementById('sideDay').textContent='Day '+state.day;document.getElementById('eyebrow').textContent=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'][(state.day-1)%7]+' · DAY '+state.day;document.getElementById('pageTitle').textContent={dashboard:'Your dashboard',market:'Find your next deal',garage:'Your garage',workshop:'Build something brilliant',lot:'Your 3D dealership',ledger:'The books'}[state.screen];}
function go(screen){state.screen=screen;render()}
function toast(msg){let root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>root.innerHTML='',2300)}
function carValue(c){let parts=(c.parts||[]).reduce((a,id)=>a+(partCatalog.find(p=>p.id===id)?.boost||0),0);return Math.round(c.base*(.55+c.cond/200)+parts)}
function badge(c){return c.cond>=80?'Excellent':c.cond>=65?'Good':'Needs love'}function cond(c){return `<span class="condition"><i class="dot ${c.cond<60?'low':c.cond<75?'mid':''}"></i>${c.cond}%</span>`}
function card(c,mode){let owned=mode==='owned',price=owned?money(carValue(c)):money(c.ask);return `<article class="vehicle-card"><div class="car-visual"><span class="pill tag">${badge(c)}</span>${carSvg(c.color,c.year)}</div><div class="card-body"><div class="card-title"><div><h4>${c.name}</h4><small>${c.desc||c.kind+' · '+c.year}</small></div><span class="price">${price}</span></div><div class="card-meta"><span>${c.miles.toLocaleString()} MI</span><span>${cond(c)}</span><span>${c.kind.toUpperCase()}</span></div><div class="card-actions">${owned?`<button class="btn secondary" onclick="selectForBuild('${c.id}')">⚒ Build</button><button class="btn" onclick="sellCar('${c.id}')">Sell · ${money(carValue(c))}</button>`:`<button class="btn" onclick="buyCar('${c.id}')" ${state.cash<c.ask?'disabled':''}>Buy · ${money(c.ask)}</button>`}</div></div></article>`}
function dash(){let value=state.inventory.reduce((n,c)=>n+carValue(c),0),profit=state.ledger.filter(x=>x.type==='sale').reduce((n,x)=>n+x.amount,0)-state.ledger.filter(x=>x.type==='purchase'||x.type==='part').reduce((n,x)=>n+x.amount,0);let recent=state.ledger.slice(0,4);return `<section class="hero"><div class="hero-copy"><span class="hero-tag">INDEPENDENT SINCE DAY ONE</span><h2>Every great<br>garage starts<br>somewhere.</h2><p>Spot the deal. Make it yours. Build a reputation one car at a time.</p><button class="btn" onclick="go('market')">Browse today's finds &nbsp;→</button></div><div class="hero-art">${carSvg('#c8f169',1)}</div></section><div class="grid stats"><div class="stat"><div class="stat-top">Available cash <span class="stat-icon">◈</span></div><strong>${money(state.cash)}</strong><small class="positive">Ready to invest</small></div><div class="stat"><div class="stat-top">Garage value <span class="stat-icon">▰</span></div><strong>${money(value)}</strong><small>${state.inventory.length} vehicle${state.inventory.length===1?'':'s'} in stock</small></div><div class="stat"><div class="stat-top">Reputation <span class="stat-icon">✳</span></div><strong>${state.rep}<small style="font-size:13px;color:#929991"> / 100</small></strong><small class="positive">${state.rep<30?'Local newcomer':state.rep<60?'Known around town':'Neighborhood favorite'}</small></div><div class="stat"><div class="stat-top">Net profit <span class="stat-icon">↗</span></div><strong>${money(profit)}</strong><small>Across all deals</small></div></div><div class="grid" style="grid-template-columns:1fr;gap:25px"><section><div class="section-head"><div><h3>Fresh from the marketplace</h3><p>Good deals don't stay parked for long.</p></div><button class="btn ghost" onclick="go('market')">See all ${state.market.length} →</button></div><div class="grid cards">${state.market.slice(0,3).map(c=>card(c,'market')).join('')}</div></section><section><div class="section-head"><div><h3>Latest activity</h3><p>Your business, at a glance.</p></div><button class="btn ghost" onclick="go('ledger')">Open ledger →</button></div>${activityRows(recent)}</section></div>`}
function activityRows(entries){if(!entries.length)return `<div class="list"><div class="empty"><b>It's a clean slate.</b>Buy your first car to get the wheels turning.</div></div>`;return `<div class="list">${entries.map(x=>`<div class="ledger-row"><div>${x.title}<small>Day ${x.day} · ${x.detail}</small></div><span>${x.type==='sale'?'Sale':'Expense'}</span><span class="${x.type==='sale'?'gain':'loss'}">${x.type==='sale'?'+':'−'}${money(x.amount)}</span></div>`).join('')}</div>`}
function market(){return `<div class="section-head"><div><h3>Today's listings</h3><p>Six hand-picked opportunities. Check condition before you commit.</p></div><span class="pill">${state.market.length} AVAILABLE</span></div>${state.market.length?`<div class="grid cards">${state.market.map(c=>card(c,'market')).join('')}</div>`:`<div class="list"><div class="empty"><b>The lot is picked clean.</b>Roll into the next day to see new listings.<br><br><button class="btn" onclick="nextDay()">Advance to next day →</button></div></div>`}<div class="notice">Dealer tip: a car's condition and mileage affect the resale price. Put some work into a rough find in the workshop to unlock its real value.</div>`}
function garage(){return `<div class="build-banner"><div><h3>${state.inventory.length?`${state.inventory.length} ride${state.inventory.length===1?'':'s'} in your garage`:'Your first bay is waiting.'}</h3><p>${state.inventory.length?'Tune them up, then sell for a tidy profit.':'Find a promising vehicle at the marketplace to get started.'}</p></div><button class="btn" onclick="go('${state.inventory.length?'workshop':'market'}')">${state.inventory.length?'Open workshop':'Browse cars'} →</button></div>${state.inventory.length?`<div class="grid cards">${state.inventory.map(c=>card(c,'owned')).join('')}</div>`:`<div class="list"><div class="empty"><b>No cars in stock yet.</b>Every great dealer's story begins with one good buy.</div></div>`}`}
function workshop(){let selected=state.inventory.find(c=>c.id===state.selectedId)||state.inventory[0];if(selected)state.selectedId=selected.id;return `<div class="build-banner"><div><h3>Turn a rough diamond into a showroom star.</h3><p>Install upgrades to raise resale value, then take your build to market.</p></div><span class="pill">${state.inventory.length} PROJECT${state.inventory.length===1?'':'S'}</span></div>${!selected?`<div class="list"><div class="empty"><b>Your workshop is quiet.</b>Buy a vehicle first, then come back to build.<br><br><button class="btn" onclick="go('market')">Find a project →</button></div></div>`:`<div class="grid workshop-grid"><section class="work-card"><span class="select-label">SELECT A PROJECT</span><select class="field" onchange="state.selectedId=this.value;render()">${state.inventory.map(c=>`<option value="${c.id}" ${c.id===selected.id?'selected':''}>${c.name} · ${c.cond}% condition</option>`).join('')}</select><div class="car-visual" style="height:185px;border-radius:9px">${carSvg(selected.color,selected.year)}</div><h3 style="margin-top:17px">${selected.name}</h3><p>${selected.desc||selected.kind+' · '+selected.year}</p><span class="select-label">OVERALL CONDITION — ${selected.cond}%</span><div class="progress"><i style="width:${selected.cond}%"></i></div><div class="stats-mini"><div class="mini"><span>CURRENT VALUE</span><b>${money(carValue(selected))}</b></div><div class="mini"><span>UPGRADES FITTED</span><b>${(selected.parts||[]).length} / ${partCatalog.length}</b></div><div class="mini"><span>ASKING</span><b>${money(carValue(selected)+1000)}</b></div></div><div class="note">Build smart: parts increase value, but your profit is what remains after purchase and upgrade costs.</div></section><section class="work-card"><h3>Parts & upgrades</h3><p>Install one of these improvements. A part can only be fitted once per vehicle.</p><div class="parts">${partCatalog.map(p=>{let done=(selected.parts||[]).includes(p.id);return `<div class="part"><div class="part-info"><strong>${p.name}</strong><small>${done?'Installed · adds '+money(p.boost)+' value':p.desc+' · +'+money(p.boost)+' value'}</small></div><button class="btn ${done?'secondary':''}" ${done||state.cash<p.cost?'disabled':''} onclick="installPart('${selected.id}','${p.id}')">${done?'✓ Fitted':money(p.cost)}</button></div>`}).join('')}</div><div class="notice">Need more cash? Sell a vehicle from your garage, or wait for the next day's fresh listings.</div></section></div>`}`}
function ledger(){let spent=state.ledger.filter(x=>x.type!=='sale').reduce((n,x)=>n+x.amount,0),earned=state.ledger.filter(x=>x.type==='sale').reduce((n,x)=>n+x.amount,0);return `<div class="grid stats" style="margin-bottom:21px"><div class="stat"><div class="stat-top">Total revenue</div><strong>${money(earned)}</strong><small>Vehicle sales</small></div><div class="stat"><div class="stat-top">Total investment</div><strong>${money(spent)}</strong><small>Cars & improvements</small></div><div class="stat"><div class="stat-top">Net result</div><strong class="${earned-spent>=0?'positive':''}">${money(earned-spent)}</strong><small>Revenue less investment</small></div><div class="stat"><div class="stat-top">Deals completed</div><strong>${state.ledger.filter(x=>x.type==='sale').length}</strong><small>More deals, more reputation</small></div></div><div class="section-head"><div><h3>Transaction history</h3><p>Every dollar tells a story.</p></div></div>${activityRows(state.ledger)}</div>`}
function render(){try{localStorage.setItem('motorhouse-save',JSON.stringify(state))}catch(e){}head();navRender();let views={dashboard:dash,market,garage,workshop,lot:()=>window.lotScreen?window.lotScreen():'<div class="lot-loading">Preparing your 3D lot…</div>',ledger};document.getElementById('content').innerHTML=`<div class="view">${views[state.screen]()}</div>`;if(state.screen==='lot'&&window.setupLot)window.setupLot()}
function addLog(type,title,amount,detail){state.ledger.unshift({type,title,amount,detail,day:state.day})}
function buyCar(id){let c=state.market.find(x=>x.id===id);if(!c||state.cash<c.ask)return;state.cash-=c.ask;state.inventory.push({...c,id:uid(),parts:[]});addLog('purchase','Bought '+c.name,c.ask,'Vehicle purchase');state.market=state.market.filter(x=>x.id!==id);toast('Nice find. '+c.name+' is yours.');render()}
function sellCar(id){let i=state.inventory.findIndex(x=>x.id===id);if(i<0)return;let c=state.inventory[i],value=carValue(c),offer=Math.round(value*(.94+Math.random()*.12));state.cash+=offer;state.rep=Math.min(100,state.rep+Math.max(1,Math.round(c.cond/18)));addLog('sale','Sold '+c.name,offer,'Retail sale · '+c.cond+'% condition');state.inventory.splice(i,1);if(state.selectedId===id)state.selectedId=state.inventory[0]?.id||null;toast('Sold for '+money(offer)+'! Reputation +'+Math.max(1,Math.round(c.cond/18)));render()}
function installPart(carId,partId){let c=state.inventory.find(x=>x.id===carId),p=partCatalog.find(x=>x.id===partId);if(!c||!p||state.cash<p.cost||(c.parts||[]).includes(partId))return;state.cash-=p.cost;c.parts.push(partId);c.cond=Math.min(100,c.cond+Math.round(p.boost/500));addLog('part','Installed '+p.name,p.cost,c.name);toast(p.name+' installed. Value is up!');render()}
function selectForBuild(id){state.selectedId=id;go('workshop')}
function nextDay(){state.day++;makeMarket();let income=state.inventory.length?Math.min(250,state.inventory.length*45):0;if(income){state.cash-=income;addLog('part','Lot & upkeep',income,'Daily operating costs')}toast('Day '+state.day+' — fresh listings just landed.');render()}
document.getElementById('nextDay').onclick=nextDay;
render();
</script>
<script type="module">

const lotCosts={office:4200,showroom:7600,service:5900};const lotNames={office:'Dealer office',showroom:'Glass showroom',service:'Service bay'};
let lot={renderer:null,scene:null,camera:null,keys:{},yaw:0,pitch:-.12,drag:false,px:0,py:0,tool:'walk',buildings:[],cars:[],toastTimer:null};
function lotScreen(){return `<section class="lot-shell"><div class="lot-toolbar"><button class="lot-tool active" data-tool="walk">↟ Walk</button><button class="lot-tool" data-tool="office">＋ Office · $4,200</button><button class="lot-tool" data-tool="showroom">＋ Showroom · $7,600</button><button class="lot-tool" data-tool="service">＋ Service bay · $5,900</button><span class="spacer"></span><span class="lot-meta">WASD MOVE · MOUSE LOOK · CLICK TO BUILD</span></div><div class="lot-viewport" id="lotViewport"><div class="lot-toast" id="lotToast"></div><div class="lot-hint"><b>WASD</b> walk &nbsp; <b>Drag</b> look &nbsp; <b>Click</b> place selected building<br>Explore your lot and grow the dealership.</div></div><div class="lot-help"><strong>Build your dealership in 3D.</strong> Select a building, then click an open spot on the lot. Cars you own are parked by the showroom. Click <strong>Walk</strong> to explore again.</div></section>`}
window.lotScreen=lotScreen;
function mat(color,rough=.72,extra={}){return new THREE.MeshStandardMaterial({color,roughness:rough,...extra})}
function box(parent,x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function wheel(parent,x,y,z,r){const tire=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.17,20),mat('#202522',.95));tire.rotation.z=Math.PI/2;tire.position.set(x,y,z);tire.castShadow=true;parent.add(tire);const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.48,r*.48,.18,12),mat('#adb4af',.35,{metalness:.65}));hub.rotation.z=Math.PI/2;hub.position.copy(tire.position);parent.add(hub)}
function createCar(spec,x,z,index=0){const g=new THREE.Group();g.position.set(x,0,z);const color=mat(spec.color,.35,{metalness:.38});const dark=mat('#202a2a',.19,{metalness:.22});const chrome=mat('#aeb6b2',.3,{metalness:.78});const glass=mat('#8ba7a7',.18,{metalness:.1,transparent:true,opacity:.78});const light=mat('#f2e7c7',.2,{emissive:'#5c4a24'});const rear=mat('#b64232',.3,{emissive:'#46120c'});
// Silhouette proportions are chosen per body style rather than using a generic car icon.
let type=spec.kind, length=type==='Pickup'?4.7:type==='4x4'?4.05:type==='Roadster'?3.65:3.95, width=type==='Pickup'?1.85:1.75, hood=.95, cabin=1.75;
box(g,0,.65,.05,length,.68,width,color);
if(type==='Pickup'){box(g,-1.37,.91,.05,.95,.48,1.67,color);box(g,1.18,.88,.05,1.13,.37,1.82,color);box(g,1.04,1.1,.05,1.03,.46,1.57,dark);box(g,-.24,1.2,.05,1.3,1.02,1.48,color);box(g,-.24,1.27,.05,1.19,.7,1.39,glass);box(g,-.93,1.2,.05,.11,.95,1.67,color)}
else if(type==='4x4'){box(g,-.12,1.13,.03,2.38,1.12,1.66,color);box(g,-.12,1.28,.03,2.18,.72,1.56,glass);box(g,.96,1.04,.03,.18,.89,1.69,color);box(g,-1.18,.77,.03,.24,.84,1.76,color);const spare=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.22,20),mat('#202522'));spare.rotation.x=Math.PI/2;spare.position.set(-2.01,.92,.05);g.add(spare)}
else if(type==='Roadster'){box(g,.13,.95,.03,1.78,.42,1.5,color);box(g,-.02,1.22,.03,1.28,.48,1.28,color);box(g,.43,1.27,.03,.67,.39,1.22,glass);box(g,-1.32,.68,.03,.9,.52,1.64,color);}
else{const hatch=type==='Hatchback';box(g,-.15,1.06,.02,hatch?1.95:1.76,.86,1.53,color);box(g,-.13,1.27,.02,hatch?1.69:1.55,.61,1.43,glass);box(g,-.13,1.58,.02,hatch?1.2:1.18,.12,1.36,color);box(g,1.23,.77,.02,.28,.48,1.64,color)}
// windshield, bumpers, lamps, side mirrors and realistic four-wheel stance
box(g,1.98,.49,.02,.13,.19,width*.87,chrome);box(g,-length/2-.025,.48,.02,.13,.2,width*.87,chrome);
for(const side of [-1,1]){for(const px of [-length*.31,length*.3])wheel(g,px,.42,side*(width*.52),type==='4x4'?.43:.34);box(g,.65,1.26,side*.79,.28,.09,.16,color);box(g,.04,.68,side*(width*.51),.64,.07,.025,chrome)}
for(const side of [-1,1]){box(g,length*.48,.76,side*.38,.12,.17,.22,light);box(g,-length*.48,.73,side*.38,.11,.19,.22,rear)}
g.rotation.y=Math.PI/2;g.userData.length=length;lot.scene.add(g);return g}
function addTree(x,z,scale=1){const group=new THREE.Group();group.position.set(x,0,z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.14*scale,.2*scale,1.8*scale,7),mat('#71533a'));trunk.position.y=.9*scale;trunk.castShadow=true;group.add(trunk);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((.8-i*.11)*scale,1),mat(i===1?'#667d55':'#74875e'));crown.position.set((i%2-.5)*.24*scale,(1.8+i*.38)*scale,((i+1)%2-.5)*.15*scale);crown.castShadow=true;group.add(crown)}lot.scene.add(group)}
function textPlane(text){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='#192119';ctx.fillRect(0,0,512,128);ctx.fillStyle='#c8f169';ctx.font='bold 43px Arial';ctx.textAlign='center';ctx.fillText(text,256,80);const tex=new THREE.CanvasTexture(c);return new THREE.Mesh(new THREE.PlaneGeometry(3.8,.85),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}))}
function building(kind,x,z){const g=new THREE.Group();g.position.set(x,0,z);const wall=mat(kind==='showroom'?'#d8d8c6':kind==='service'?'#c5c6b8':'#c6bba1');const roof=mat(kind==='showroom'?'#303a32':'#39443a');if(kind==='showroom'){box(g,0,1.5,0,7,3,5,wall);box(g,0,3.12,0,7.3,.24,5.3,roof);for(let sx of [-2.35,-.8,.8,2.35])box(g,sx,1.45,2.53,1.2,2.25,.06,mat('#8da9a7',.18,{metalness:.14,transparent:true,opacity:.68}));box(g,0,.1,3.0,7.1,.2,1.3,mat('#bcb7a3'));}
else if(kind==='service'){box(g,0,1.45,0,5.5,2.9,5,wall);box(g,0,3,0,5.8,.25,5.3,roof);box(g,0,1.2,2.53,2.7,2.4,.08,mat('#5a665c'));box(g,0,2.42,2.58,2.72,.1,.1,mat('#d7d2c0'));}
else{box(g,0,1.2,0,4.2,2.4,3.6,wall);const r=box(g,0,2.62,0,4.7,.2,4.1,roof);box(g,0,1.05,1.84,1.3,1.8,.09,mat('#566e6e'));box(g,-1.2,1.45,1.87,.9,.8,.08,mat('#a0b7ad',.2));}
const sign=textPlane(kind==='showroom'?'MOTORHOUSE':kind==='service'?'SERVICE':'DEALER OFFICE');sign.position.set(0,kind==='showroom'?2.72:2.2,2.72);g.add(sign);lot.scene.add(g);return g}
function setupLot(){const root=document.getElementById('lotViewport');if(!root)return;if(lot.frame)cancelAnimationFrame(lot.frame);if(lot.renderer){window.removeEventListener('resize',resizeLot);lot.renderer.domElement.removeEventListener('pointerdown',onLotDown);lot.renderer.domElement.removeEventListener('pointermove',onLotMove);lot.renderer.dispose();lot.renderer=null}lot.scene=new THREE.Scene();lot.scene.background=new THREE.Color('#afc3c0');lot.scene.fog=new THREE.Fog('#afc3c0',35,90);lot.camera=new THREE.PerspectiveCamera(68,root.clientWidth/root.clientHeight,.1,150);lot.camera.position.set(0,1.72,10);lot.yaw=Math.PI;lot.pitch=-.1;lot.scene.add(new THREE.HemisphereLight('#e7f2ef','#767458',2.2));const sun=new THREE.DirectionalLight('#fff0d6',3.3);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;lot.scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat('#899176'));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;lot.scene.add(ground);
// asphalt drive, parking bays, sidewalks, and landscape edging
box(lot.scene,0,.015,-10,42,.03,5,mat('#555b53'));box(lot.scene,0,.025,0,27,.04,13,mat('#aaa99a'));box(lot.scene,-13,.06,0,.22,.02,13,mat('#eee1bd'));box(lot.scene,13,.06,0,.22,.02,13,mat('#eee1bd'));for(let i=0;i<7;i++)box(lot.scene,-10+i*3.2,.065,-2,.07,.02,4,mat('#ece3bd'));
// Default starter office, signage and outdoor landscaping
building('office',0,-5.3);const pylon=box(lot.scene,-10,2.3,-4,.25,4,.25,mat('#384039'));const sign=textPlane('MOTORHOUSE');sign.position.set(-10,3.8,-3.85);lot.scene.add(sign);for(const [x,z,s] of [[-17,-14,1.2],[17,-14,1.3],[-18,9,1],[18,10,1.1],[-15,15,1.1],[15,16,.9]])addTree(x,z,s);
lot.buildings=[];lot.cars=[];for(const b of (state.lotBuildings||[])){const o=building(b.kind,b.x,b.z);lot.buildings.push(o)}
const owned=state.inventory||[];owned.forEach((car,i)=>{const x=-5+(i%4)*3.2,z=3+Math.floor(i/4)*3.3;const obj=createCar(car,x,z,i);lot.cars.push(obj)});
lot.renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});lot.renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));lot.renderer.setSize(root.clientWidth,root.clientHeight);lot.renderer.shadowMap.enabled=true;lot.renderer.shadowMap.type=THREE.PCFSoftShadowMap;lot.renderer.outputColorSpace=THREE.SRGBColorSpace;lot.renderer.toneMapping=THREE.ACESFilmicToneMapping;lot.renderer.toneMappingExposure=1.12;root.prepend(lot.renderer.domElement);lot.renderer.domElement.addEventListener('pointerdown',onLotDown);lot.renderer.domElement.addEventListener('pointermove',onLotMove);lot.renderer.domElement.addEventListener('pointerup',()=>lot.drag=false);lot.renderer.domElement.addEventListener('pointerleave',()=>lot.drag=false);lot.renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('resize',resizeLot);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{lot.tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));if(lot.tool!=='walk')showLotToast(lotCosts[lot.tool]?'Click an open spot to place the '+lotNames[lot.tool]+'.':'WASD to walk around your dealership.')});lot.renderer.domElement.addEventListener('click',placeBuilding);animateLot()}
function resizeLot(){const root=document.getElementById('lotViewport');if(root&&lot.renderer){lot.camera.aspect=root.clientWidth/root.clientHeight;lot.camera.updateProjectionMatrix();lot.renderer.setSize(root.clientWidth,root.clientHeight)}}
function showLotToast(t){let el=document.getElementById('lotToast');if(!el)return;el.textContent=t;el.classList.add('show');clearTimeout(lot.toastTimer);lot.toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function onLotDown(e){if(lot.tool!=='walk'){lot.drag=false;return}lot.drag=true;lot.px=e.clientX;lot.py=e.clientY;lot.renderer.domElement.setPointerCapture(e.pointerId)}function onLotMove(e){if(!lot.drag||lot.tool!=='walk')return;lot.yaw-=(e.clientX-lot.px)*.004;lot.pitch=Math.max(-.7,Math.min(.5,lot.pitch-(e.clientY-lot.py)*.003));lot.px=e.clientX;lot.py=e.clientY}
function placeBuilding(e){if(lot.tool==='walk'||!lot.renderer)return;const cost=lotCosts[lot.tool];if(state.cash<cost){showLotToast('Not enough cash — complete a vehicle deal first.');return}const rect=lot.renderer.domElement.getBoundingClientRect(),ndc=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height)*2+1),ray=new THREE.Raycaster();ray.setFromCamera(ndc,lot.camera);const floor=new THREE.Plane(new THREE.Vector3(0,1,0),0),point=new THREE.Vector3();if(!ray.ray.intersectPlane(floor,point)||Math.abs(point.x)>17||point.z>14||point.z< -17){showLotToast('Choose a clear spot inside your lot.');return}if(Math.abs(point.x)<4&&point.z< -2&&point.z> -9){showLotToast('That spot is already occupied.');return}if(lot.buildings.some(b=>Math.hypot(b.position.x-point.x,b.position.z-point.z)<5.2)){showLotToast('Leave room around your other buildings.');return}state.cash-=cost;state.lotBuildings=state.lotBuildings||[];state.lotBuildings.push({kind:lot.tool,x:Math.round(point.x),z:Math.round(point.z)});lot.buildings.push(building(lot.tool,Math.round(point.x),Math.round(point.z)));addLog('part','Built '+lotNames[lot.tool],cost,'Dealership construction');showLotToast(lotNames[lot.tool]+' built!');render()}
function animateLot(){if(!lot.renderer)return;lot.frame=requestAnimationFrame(animateLot);let forward=0,side=0;if(lot.keys.KeyW||lot.keys.ArrowUp)forward++;if(lot.keys.KeyS||lot.keys.ArrowDown)forward--;if(lot.keys.KeyD||lot.keys.ArrowRight)side++;if(lot.keys.KeyA||lot.keys.ArrowLeft)side--;const speed=.13,dx=(Math.sin(lot.yaw)*forward+Math.cos(lot.yaw)*side)*speed,dz=(Math.cos(lot.yaw)*forward-Math.sin(lot.yaw)*side)*speed;lot.camera.position.x=THREE.MathUtils.clamp(lot.camera.position.x+dx,-21,21);lot.camera.position.z=THREE.MathUtils.clamp(lot.camera.position.z+dz,-20,20);lot.camera.rotation.order='YXZ';lot.camera.rotation.y=lot.yaw;lot.camera.rotation.x=lot.pitch;lot.renderer.render(lot.scene,lot.camera)}
window.addEventListener('keydown',e=>{lot.keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>lot.keys[e.code]=false);window.setupLot=setupLot;
</script></body></html>
